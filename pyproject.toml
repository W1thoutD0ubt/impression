[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impression-study"
version = "0.1.0"
description = "Report-based impression generation and paired reader study scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.40,<3"]

[project.scripts]
impression-study = "impression_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
